<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Mix | DJ MIX HUB</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #100d1b;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 650px;
            margin: 30px auto;
            background: #1d172b;
            padding: 24px;
            border-radius: 14px;
        }
        input, textarea, select, button {
            width: 100%;
            padding: 13px;
            margin: 9px 0 18px;
            border: 1px solid #49376b;
            border-radius: 8px;
            background: #211a32;
            color: white;
        }
        button {
            background: #7545c5;
            cursor: pointer;
        }
        a { color: #c4a1ff; text-decoration: none; }
        label { color: #c4a1ff; }
    </style>
</head>
<body>
<div class="container">
    <h1>✏️ Edit Mix</h1>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Mix title</label>
        <input type="text" name="title" value="{{ mix.title }}" required>

        <label>Description</label>
        <textarea name="description" rows="5">{{ mix.description or '' }}</textarea>

        <label>Music genre</label>
        <select name="genre_id">
            <option value="">No genre</option>
            {% for genre in genres %}
                <option value="{{ genre.id }}"
                    {% if mix.genre_id == genre.id %}selected{% endif %}>
                    {{ genre.name }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Save Changes</button>
    </form>

    <a href="{{ url_for('admin_manage_mixes') }}">← Back to Manage Mixes</a>
</div>
</body>
</html>
