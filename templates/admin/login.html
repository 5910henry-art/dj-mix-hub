<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | DJ MIX HUB</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #090914;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .login-box {
            width: 100%;
            max-width: 410px;
            padding: 35px;
            border: 1px solid #29243e;
            border-radius: 18px;
            background: #141322;
        }
        h1 { margin: 0 0 8px; font-size: 27px; }
        .subtitle { color: #aaa6bd; margin-bottom: 28px; }
        label { display: block; margin: 16px 0 8px; }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #39334f;
            border-radius: 9px;
            background: #0d0c18;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            color: white;
            background: linear-gradient(100deg, #793cff, #d33bba);
            font-size: 16px;
            font-weight: bold;
        }
        .message { color: #ff9292; margin: 12px 0; }
        a { color: #bd9cff; text-decoration: none; }
        .back { display: block; text-align: center; margin-top: 22px; }
    </style>
</head>
<body>
    <main class="login-box">
        <h1>🎧 DJ MIX HUB</h1>
        <p class="subtitle">Administrator sign in</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Username</label>
            <input id="username" name="username" required
                   autocomplete="username">

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   required autocomplete="current-password">

            <button type="submit">Sign in</button>
        </form>

        <a class="back" href="/">← Back to website</a>
    </main>
</body>
</html>
