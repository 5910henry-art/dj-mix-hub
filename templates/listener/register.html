<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | DJ MIX HUB</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .listener-auth {
            max-width: 480px;
            margin: 65px auto;
            padding: 30px;
            background: #191923;
            border: 1px solid #343444;
            border-radius: 18px;
        }
        .listener-auth h1 { color: white; }
        .listener-auth p { color: #aaa; }
        .listener-auth label {
            display: block;
            margin: 17px 0 7px;
            color: #ddd;
        }
        .listener-auth input {
            width: 100%;
            padding: 13px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #101018;
            color: white;
            box-sizing: border-box;
        }
        .listener-auth button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: 0;
            border-radius: 8px;
            background: #d9a441;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }
        .listener-auth a { color: #e5b64f; }
        .listener-auth .messages {
            color: #ff9999;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <main class="listener-auth">
        <a href="/">← DJ MIX HUB</a>
        <h1>Create your account</h1>
        <p>Join DJ MIX HUB and save your favourite mixes.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <label>Username *</label>
            <input type="text" name="username"
                   maxlength="80" required autocomplete="username">

            <label>Display name</label>
            <input type="text" name="display_name"
                   maxlength="120" autocomplete="name">

            <label>Email address *</label>
            <input type="email" name="email"
                   maxlength="150" required autocomplete="email">

            <label>Password *</label>
            <input type="password" name="password"
                   minlength="8" required autocomplete="new-password">

            <label>Confirm password *</label>
            <input type="password" name="confirm_password"
                   minlength="8" required autocomplete="new-password">

            <button type="submit">Create Account</button>
        </form>

        <p>Already registered?
            <a href="{{ url_for('listener_login') }}">Log in</a>
        </p>
    </main>
</body>
</html>
