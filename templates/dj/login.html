<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ Login | DJ MIX HUB</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:25px 15px;background:#0b0a15;color:white;font-family:Arial,sans-serif}
.container{max-width:450px;margin:45px auto;padding:28px;background:#171526;border:1px solid #302a45;border-radius:16px}
input{width:100%;padding:13px;margin:8px 0 18px;border:1px solid #39334f;border-radius:8px;background:#0d0c18;color:white}
label{display:block;color:#c4a4ff}button{width:100%;padding:14px;border:0;border-radius:9px;background:linear-gradient(100deg,#793cff,#d33bba);color:white;font-weight:bold}
a{color:#c4a4ff;text-decoration:none}.message{color:#ffaaaa}
</style>
</head>
<body><div class="container">
<h1>🎧 DJ Login</h1>
{% with messages=get_flashed_messages() %}{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}{% endwith %}
<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Username or email</label><input name="username" required>
<label>Password</label><input type="password" name="password" required>
<button type="submit">Login to DJ Account</button>
</form>
<p>New DJ? <a href="{{ url_for('dj_register') }}">Register here</a></p>
<p><a href="/">← Back to website</a></p>
</div></body></html>
