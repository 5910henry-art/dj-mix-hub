<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Mix | DJ MIX HUB</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#0b0a15;color:white;font-family:Arial,sans-serif}
.container{max-width:650px;margin:30px auto;padding:26px;background:#171526;border:1px solid #302a45;border-radius:15px}
label{display:block;margin:17px 0 7px;color:#c4a4ff}
input,textarea,select{width:100%;padding:13px;border:1px solid #39334f;border-radius:8px;background:#0d0c18;color:white}
textarea{min-height:100px}.hint{color:#aaa6bd;font-size:13px}
button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:9px;background:linear-gradient(100deg,#793cff,#d33bba);color:white;font-weight:bold}
a{color:#c4a4ff;text-decoration:none}.message{color:#ffaaaa}
</style>
</head>
<body><div class="container">
<h1>🎧 Upload Your Mix</h1>
<p>Upload your mix, then publish or unpublish it whenever you choose from your dashboard.</p>
{% with messages=get_flashed_messages() %}{% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}{% endwith %}
<form method="POST" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Mix title *</label><input name="title" maxlength="180" required>
<label>Description</label><textarea name="description"></textarea>
<label>Genre</label><select name="genre_id"><option value="">Choose genre</option>{% for genre in genres %}<option value="{{ genre.id }}">{{ genre.name }}</option>{% endfor %}</select>
<label>MP3 audio file *</label><input type="file" name="audio_file" accept=".mp3,audio/mpeg" required>
<p class="hint">MP3 only. Maximum request size: 100 MB.</p>
<label>Cover artwork</label><input type="file" name="cover_image" accept=".jpg,.jpeg,.png,.webp">
<button type="submit">Upload My Mix</button>
</form>
<p><a href="{{ url_for('dj_dashboard') }}">← Back to DJ Dashboard</a></p>
</div></body></html>
