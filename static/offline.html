<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101018">
    <title>Offline | DJ MIX HUB</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #101018;

            font-family: Arial, sans-serif;
            text-align: center;
        }
        main { padding: 30px; max-width: 420px; }
        h1 { color: #c084fc; }
        p { color: #ccc; line-height: 1.6; }
        a {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 22px;
            border-radius: 8px;
            background: #8b5cf6;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <h1>DJ MIX HUB</h1>
        <h2>You're currently offline</h2>
        <p>Please check your internet connection. Once you're connected,

        <a href="/">Try again</a>
    </main>

</html>
